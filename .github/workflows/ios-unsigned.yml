name: iOS Unsigned IPA

# Unsigned, for sideloading: AltStore / Sideloadly re-sign it with the tester's Apple ID.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: xnt-wallet-tauri
    env:
      # rustc overflows its stack compiling xnt-core with the default size.
      RUST_MIN_STACK: '67108864'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Access to the private xnt-core repo
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          test -n "$GITEA_TOKEN" || { echo "GITEA_TOKEN secret is not set"; exit 1; }
          git config --global url."https://ci:${GITEA_TOKEN}@git.softly.com/".insteadOf "https://git.softly.com/"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xnt-wallet-tauri/src-tauri
          # Separate from desktop-build's macOS cache: same job name and runner, different target.
          key: aarch64-apple-ios
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xnt-wallet-tauri/package-lock.json

      - run: npm ci

      # Same Xcode 26 MetalToolchain link fix as ios-testflight.yml (tauri-apps/tauri#15066).
      - name: Work around Xcode 26 MetalToolchain Swift-compat link break
        working-directory: .
        run: |
          sudo rm -rf /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain || true
          rm -rf "$HOME/Library/Developer/DVTDownloads/MetalToolchain" || true
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)/usr/lib/swift"
          for LIB in libswiftCompatibility50.a libswiftCompatibility51.a libswiftCompatibility56.a \
                     libswiftCompatibilityConcurrency.a libswiftCompatibilityDynamicReplacements.a \
                     libswiftCompatibilityPacks.a; do
            if [ -f "$TOOLCHAIN/$LIB" ] && [ ! -e "$SDK/$LIB" ]; then sudo ln -sf "$TOOLCHAIN/$LIB" "$SDK/$LIB"; fi
          done

      # The project carries upstream's App Store signing (team, profile, identity); strip it here
      # so the archive builds unsigned. The export step that follows needs signing and is expected to fail.
      - name: Build the unsigned archive
        run: |
          P=src-tauri/gen/apple/xnt-wallet-tauri.xcodeproj/project.pbxproj
          sed -i '' -E '/PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM/d' "$P"
          sed -i '' -E 's/CODE_SIGN_STYLE = (Manual|Automatic);/CODE_SIGN_STYLE = Automatic; CODE_SIGNING_ALLOWED = NO;/' "$P"
          grep -c 'CODE_SIGNING_ALLOWED = NO' "$P"
          npx tauri ios build --target aarch64 2>&1 | tee "$RUNNER_TEMP/ios-build.log" || true
          ARCHIVE=$(find src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          test -n "$ARCHIVE" || { echo "no .xcarchive was produced"; exit 1; }
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package the IPA
        run: |
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "the archive has no .app"; exit 1; }
          lipo -info "$APP"/"$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/XNT-Wallet-unsigned.ipa" Payload)
          ls -l "$GITHUB_WORKSPACE/XNT-Wallet-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: xnt-wallet-ios-unsigned
          path: XNT-Wallet-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
