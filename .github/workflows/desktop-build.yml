name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which installers to build
        type: choice
        options: [both, windows, macos]
        default: both
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Tag pushes have no inputs, so they build both.
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: xnt-wallet-tauri
    env:
      # rustc overflows its stack compiling xnt-core with the default size.
      RUST_MIN_STACK: '67108864'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Access to the private xnt-core repo
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          test -n "$GITEA_TOKEN" || { echo "GITEA_TOKEN secret is not set"; exit 1; }
          git config --global url."https://ci:${GITEA_TOKEN}@git.softly.com/".insteadOf "https://git.softly.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xnt-wallet-tauri/src-tauri
          # Keeps compiled deps when a late step fails, so the retry skips xnt-core.
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xnt-wallet-tauri/package-lock.json

      - run: npm ci

      - name: Build installers
        run: npx tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }}

      - uses: actions/upload-artifact@v4
        with:
          name: xnt-wallet-${{ runner.os }}
          path: |
            xnt-wallet-tauri/src-tauri/target/release/bundle/nsis/*.exe
            xnt-wallet-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
