name: iOS TestFlight

# Manual trigger from the Actions tab (avoids burning CI minutes on every push).
on:
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's macOS runner ships a STABLE Xcode + RELEASE iOS SDK — this is what
    # fixes ITMS-90111 (no beta/seed SDK, unlike the local beta-macOS environment).
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: xnt-wallet-tauri

    steps:
      - name: Checkout (with the xnt-core submodule — required to compile)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select the latest STABLE Xcode (never a beta)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain (sanity check — must be a release Xcode/SDK)
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-build-version

      - name: Rust toolchain (+ iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo + target (huge speedup after the first run)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xnt-wallet-tauri/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xnt-wallet-tauri/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # ---- Signing ----
      - name: Import Apple Distribution certificate into the keychain
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Place App Store Connect API key (auto-discovered by xcodebuild + altool)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Install provisioning profile (manual signing)
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$PROFILE_B64" | base64 --decode > /tmp/pp.mobileprovision
          UUID=$(security cms -D -i /tmp/pp.mobileprovision | plutil -extract UUID raw -)
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"; cp /tmp/pp.mobileprovision "$D/$UUID.mobileprovision"
          done
          echo "installed provisioning profile $UUID"

      # ---- Build ----
      # Tauri runs `npm run build` (frontend) via beforeBuildCommand, compiles the
      # Rust for aarch64-apple-ios, archives, and exports the IPA. Automatic signing
      # works headlessly because the cert is in the keychain and xcodebuild
      # auto-discovers the ASC API key for -allowProvisioningUpdates.
      # Xcode 26's MetalToolchain (on GitHub runners) hijacks the Swift lib search path and
      # omits the swiftCompatibility5.x back-deploy archives that the Tauri/Rust bridge
      # (libapp.a) force-loads -> link fails: undefined __swift_FORCE_LOAD_$_swiftCompatibility56.
      # The TOOLCHAINS env var does NOT propagate through `tauri ios build`, so fix it at the
      # filesystem level: drop the Metal asset AND symlink the compat archives from the default
      # toolchain into the SDK's swift lib dir (which the linker searches).
      # Refs: tauri-apps/tauri#15066, actions/runner-images#13135
      - name: Work around Xcode 26 MetalToolchain Swift-compat link break
        run: |
          set -x
          sudo rm -rf /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain || true
          rm -rf "$HOME/Library/Developer/DVTDownloads/MetalToolchain" || true
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)/usr/lib/swift"
          echo "compat libs in default toolchain:"; ls -1 "$TOOLCHAIN" | grep -i compat || echo "  (NONE)"
          for LIB in libswiftCompatibility50.a libswiftCompatibility51.a libswiftCompatibility56.a \
                     libswiftCompatibilityConcurrency.a libswiftCompatibilityDynamicReplacements.a \
                     libswiftCompatibilityPacks.a; do
            if [ -f "$TOOLCHAIN/$LIB" ] && [ ! -e "$SDK/$LIB" ]; then
              sudo ln -sf "$TOOLCHAIN/$LIB" "$SDK/$LIB" && echo "linked $LIB into SDK"
            fi
          done
          echo "compat libs now in SDK swift dir:"; ls -l "$SDK" | grep -i compat || echo "  (NONE)"

      - name: Build iOS app (release, App Store export)
        env:
          # Secondary guard (harmless if ineffective): prefer the default toolchain.
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: npm run tauri ios build -- --export-method app-store-connect

      - name: Verify the built SDK is a RELEASE build (guard against beta/seed)
        run: |
          APP=$(find src-tauri/gen/apple/build -maxdepth 6 -name "*.app" | head -1)
          echo "App: $APP"
          plutil -p "$APP/Info.plist" | grep -iE 'DTXcode|DTSDKBuild|CFBundleVersion'

      # ---- Save the IPA for you to download and upload via Transporter ----
      - name: Upload IPA as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: xnt-wallet-tauri/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: ignore
