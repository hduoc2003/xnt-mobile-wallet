[package]
name = "xnt-wallet-tauri"
version = "0.1.0"
description = "XNT Wallet - Tauri Desktop Application"
authors = ["XNT Team"]
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
name = "neptune_wallet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Leviathan fork of xnt-core (V1 consensus + bridge)
neptune-privacy = { git = "https://git.softly.com/leviathan/xnt-core", rev = "a7cc878629164dcc18221aa62b02e68ce9ce53d1" }

# Utilities
hex = "0.4"
bincode = "1.3"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls-webpki-roots"] }
num-traits = "0.2"
rand = "0.9"
itertools = "0.12"
rayon = "1.9"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
log = "0.4"
libc = "0.2"
bip39 = { version = "1.0", package = "tiny-bip39" }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"

# Logger for desktop platforms
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

# OpenSSL vendored for Android builds
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
android_logger = "0.13"

# Optimize Triton VM in dev/test profiles for better performance
[profile.dev.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

[profile.test.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.release.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

# Patch leveldb-sys with local version that has Android 64-bit fixes
[patch.crates-io]
leveldb-sys = { path = "./patches/leveldb-sys-2.0.9" }


[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
