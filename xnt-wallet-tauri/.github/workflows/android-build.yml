name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'Neptune-wallet-tauri/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        targets: aarch64-linux-android,x86_64-linux-android
    
    - name: Install Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: "26.1.10909125"
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Setup Android environment
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
        echo "PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV
    
    - name: Install dependencies
      working-directory: Neptune-wallet-tauri
      run: npm install
    
    - name: Build Android APK
      working-directory: Neptune-wallet-tauri
      env:
        ANDROID_ABI: arm64-v8a
        ANDROID_PLATFORM: android-24
        CC: aarch64-linux-android24-clang
        CXX: aarch64-linux-android24-clang++
      run: |
        npm run tauri android build -- --target aarch64-linux-android
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: Neptune-wallet-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk





